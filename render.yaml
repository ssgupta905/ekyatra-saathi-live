# The API on Supabase Postgres, and the two web apps as static sites.
#
# Create it with Render's Blueprint flow (New > Blueprint, pick this repo and the
# branch to deploy). Render then asks for every variable marked `sync: false`
# below; those are secrets or addresses only you know. See docs/deploy.md for
# what to put in each, in order.
#
# This runs the *real* world: it starts empty, login is on, and records live in
# the database named by SAATHI_RECORDS_URL. SAATHI_SEED_DEMO loads a small
# synthetic cohort into an empty database so there is something to look at.

services:
  - type: web
    name: ekyatra-saathi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Keep this next to the database: the Supabase project is in eu-west-1
    # (Ireland), and Frankfurt is Render's nearest region. Change both together.
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SAATHI_ENVIRONMENT
        value: render
      - key: SAATHI_WORLD
        value: real
      # Signs sign-in tokens. Generated once by Render; changing it signs
      # everybody out.
      - key: SAATHI_AUTH_SECRET
        generateValue: true
      # Supabase > Connect > Session pooler. Render's free tier reaches IPv4
      # only and Supabase's direct host is IPv6, so the pooler is not optional.
      - key: SAATHI_RECORDS_URL
        sync: false
      # The first administrator, created once if no such account exists.
      - key: SAATHI_ADMIN_USERNAME
        sync: false
      - key: SAATHI_ADMIN_PASSWORD
        sync: false
      # Load a synthetic cohort into an empty database. Harmless once there are
      # families: it never touches a database that already has one.
      - key: SAATHI_SEED_DEMO
        value: "true"
      # The phone number the first seeded family answers to, so you can sign in
      # as a caregiver. Without an SMS provider the one-time code is written to
      # the service log, not sent.
      - key: SAATHI_SEED_DEMO_PHONE
        sync: false
      # Six digits. With no SMS provider, this phone (and only this one) signs in
      # with this code instead of one that only reaches the log. Leave it empty
      # to get real random codes.
      - key: SAATHI_DEMO_OTP
        sync: false
      # The email the first seeded family answers to, so you can sign in with a
      # code sent to it. Your own Gmail address works.
      - key: SAATHI_SEED_DEMO_EMAIL
        sync: false
      # Email for one-time codes, through Brevo over HTTPS (Render's free tier
      # cannot use SMTP). The address must be a sender verified in Brevo.
      - key: SAATHI_BREVO_API_KEY
        sync: false
      - key: SAATHI_EMAIL_FROM
        sync: false
      # The addresses of the two static sites below, comma-separated. Only
      # browsers need this; the Android app is not bound by CORS.
      - key: SAATHI_CORS_ORIGINS
        sync: false
      # Not SAATHI_GROQ_API_KEY: the settings field carries an explicit alias.
      # Optional. Without it the planner, the guard and the ledger all still
      # run; only the wording falls back to templates.
      - key: GROQ_API_KEY
        sync: false
      # Speech, in the languages this is for. Also not under the prefix: the
      # settings field is aliased to the name the key is issued under.
      # Without it a family can still type, but nothing can be read aloud —
      # and no browser has an Odia voice, so an Odia family gets no audio at
      # all rather than a worse voice.
      - key: SARVAM_KEY
        sync: false

  - type: web
    name: ekyatra-saathi-control-centre
    runtime: static
    buildCommand: >-
      cd frontend && npm ci && npm run build -w @saathi/control-centre &&
      printf '{"apiBase":"%s"}' "$SAATHI_API_BASE" > apps/control-centre/dist/config.json
    staticPublishPath: frontend/apps/control-centre/dist
    envVars:
      # https://<your API>.onrender.com/api — the API service's address plus /api.
      - key: SAATHI_API_BASE
        sync: false
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: ekyatra-saathi-family
    runtime: static
    buildCommand: >-
      cd frontend && npm ci && npm run build -w @saathi/family-web &&
      printf '{"apiBase":"%s"}' "$SAATHI_API_BASE" > apps/family-web/dist/config.json
    staticPublishPath: frontend/apps/family-web/dist
    envVars:
      - key: SAATHI_API_BASE
        sync: false
      - key: NODE_VERSION
        value: "22"

  # The vendors' own site: a cab firm, a hotel desk, a pharmacy or a scheme
  # desk signing in to answer the jobs its organisation was asked to do. It
  # shares the backend and nothing else — the role cannot read a family.
  - type: web
    name: ekyatra-saathi-partner
    runtime: static
    buildCommand: >-
      cd frontend && npm ci && npm run build -w @saathi/partner-web &&
      printf '{"apiBase":"%s"}' "$SAATHI_API_BASE" > apps/partner-web/dist/config.json
    staticPublishPath: frontend/apps/partner-web/dist
    envVars:
      - key: SAATHI_API_BASE
        sync: false
      - key: NODE_VERSION
        value: "22"

  # The district hospital's system — a second HMS, deliberately unlike the
  # first. Bahmni speaks its own REST API with no change feed; this speaks
  # plain FHIR R4 with `_lastUpdated` cursors. Saathi reads both through one
  # port, which is what "plugs into any HMS" has to mean to be worth saying.
  #
  # Bahmni itself cannot live here: Render offers managed Postgres and Key
  # Value only, and OpenMRS needs MariaDB. Bahmni runs on its own host.
  - type: web
    name: ekyatra-hapi-fhir
    runtime: image
    image:
      url: docker.io/hapiproject/hapi:latest
    # HAPI is a Spring Boot app and wants roughly a gigabyte to be comfortable.
    # Raise this if the service restarts under load; `free` will not hold it.
    plan: starter
    region: frankfurt
    healthCheckPath: /fhir/metadata
    envVars:
      # Deliberately NOT `fromDatabase.connectionString`: Render hands out a
      # `postgres://user:pw@host/db` URL and Spring needs the JDBC form,
      # `jdbc:postgresql://host:5432/db`. Wiring the two together silently
      # yields a driver error at boot, so this is entered by hand from the
      # database's connection details, and the credentials come separately.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ekyatra-hapi-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ekyatra-hapi-db
          property: password
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
        value: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      # Appointment is the resource the connector reads, and ServiceRequest +
      # Observation are the creatinine beat. All are on by default; named here
      # so a future narrowing of the server's scope is a visible change.
      - key: HAPI_FHIR_FHIR_VERSION
        value: R4
      # Writes come from the seeder and from the lab posting a result, so the
      # server must accept them.
      - key: HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES
        value: "true"

  # The city hospital's system: Medplum, a FHIR-native EHR with its own staff web
  # app, on Postgres. (OpenEMR was the first choice but runs on MySQL/MariaDB
  # only, which Render does not offer.) Saathi reads it through the same FHIR
  # connector as HAPI above. Paid instances: the server needs about 2 GB.
  #
  # Medplum reads its settings from MEDPLUM_* variables when started with `env`.
  # No password is written here: Render generates the super-admin password; read
  # it from ekyatra-medplum-server's Environment tab (MEDPLUM_DEFAULT_SUPER_ADMIN_PASSWORD).
  # Without that override Medplum seeds admin@example.com / medplum_admin, which must
  # never exist on the internet.
  - type: keyvalue
    name: ekyatra-medplum-redis
    plan: free
    region: frankfurt
    # Internal only: no public address.
    ipAllowList: []

  - type: web
    name: ekyatra-medplum-server
    runtime: image
    image:
      url: docker.io/medplum/medplum-server:latest   # pin a version tag once chosen
    plan: standard
    region: frankfurt
    # The image's argument is the config source: `env` means "read MEDPLUM_*".
    dockerCommand: env
    healthCheckPath: /healthcheck
    envVars:
      - key: PORT
        value: "8103"
      - key: MEDPLUM_PORT
        value: "8103"
      # The three below are this service's own public address and the app's.
      # Render names them after the service; enter them when the blueprint asks,
      # and correct them if Render adds a suffix to the name.
      - key: MEDPLUM_BASE_URL
        sync: false          # e.g. https://ekyatra-medplum-server.onrender.com/  (trailing slash)
      - key: MEDPLUM_STORAGE_BASE_URL
        sync: false          # the line above plus `storage/`
      - key: MEDPLUM_APP_BASE_URL
        sync: false          # e.g. https://ekyatra-medplum-app.onrender.com/
      - key: MEDPLUM_ALLOWED_ORIGINS
        sync: false          # the app's address, no trailing slash
      - key: MEDPLUM_DATABASE_HOST
        fromDatabase:
          name: ekyatra-medplum-db
          property: host
      - key: MEDPLUM_DATABASE_PORT
        fromDatabase:
          name: ekyatra-medplum-db
          property: port
      - key: MEDPLUM_DATABASE_DBNAME
        fromDatabase:
          name: ekyatra-medplum-db
          property: database
      - key: MEDPLUM_DATABASE_USERNAME
        fromDatabase:
          name: ekyatra-medplum-db
          property: user
      - key: MEDPLUM_DATABASE_PASSWORD
        fromDatabase:
          name: ekyatra-medplum-db
          property: password
      - key: MEDPLUM_REDIS_HOST
        fromService:
          type: keyvalue
          name: ekyatra-medplum-redis
          property: host
      - key: MEDPLUM_REDIS_PORT
        fromService:
          type: keyvalue
          name: ekyatra-medplum-redis
          property: port
      # Uploaded files live on the container's disk and are lost on redeploy.
      # Fine for a demo; add a disk or object storage before real documents.
      - key: MEDPLUM_BINARY_STORAGE
        value: "file:./binary/"
      - key: MEDPLUM_DEFAULT_SUPER_ADMIN_EMAIL
        value: admin@ekyatra.example
      - key: MEDPLUM_DEFAULT_SUPER_ADMIN_PASSWORD
        generateValue: true
      - key: MEDPLUM_SUPPORT_EMAIL
        value: admin@ekyatra.example

  - type: web
    name: ekyatra-medplum-app
    runtime: image
    image:
      url: docker.io/medplum/medplum-app:latest   # pin a version tag once chosen
    # nginx serving a static app; it asks the server for everything.
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: "3000"
      - key: MEDPLUM_BASE_URL
        sync: false          # the server's address, as above
      # Turn this off once the people who should have accounts have them.
      - key: MEDPLUM_REGISTER_ENABLED
        value: "true"

databases:
  - name: ekyatra-hapi-db
    plan: free
    region: frankfurt

  - name: ekyatra-medplum-db
    # The free database is taken by HAPI above (one per workspace).
    plan: basic-256mb
    region: frankfurt
