# The API on Supabase Postgres, and the two web apps as static sites.
#
# Create it with Render's Blueprint flow (New > Blueprint, pick this repo and the
# branch to deploy). Render then asks for every variable marked `sync: false`
# below; those are secrets or addresses only you know. See docs/deploy.md for
# what to put in each, in order.
#
# This runs the *real* world: it starts empty, login is on, and records live in
# the database named by SAATHI_RECORDS_URL. SAATHI_SEED_DEMO loads a small
# synthetic cohort into an empty database so there is something to look at.

services:
  - type: web
    name: ekyatra-saathi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Keep this next to the database: the Supabase project is in eu-west-1
    # (Ireland), and Frankfurt is Render's nearest region. Change both together.
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SAATHI_ENVIRONMENT
        value: render
      - key: SAATHI_WORLD
        value: real
      # Signs sign-in tokens. Generated once by Render; changing it signs
      # everybody out.
      - key: SAATHI_AUTH_SECRET
        generateValue: true
      # Supabase > Connect > Session pooler. Render's free tier reaches IPv4
      # only and Supabase's direct host is IPv6, so the pooler is not optional.
      - key: SAATHI_RECORDS_URL
        sync: false
      # The first administrator, created once if no such account exists.
      - key: SAATHI_ADMIN_USERNAME
        sync: false
      - key: SAATHI_ADMIN_PASSWORD
        sync: false
      # Load a synthetic cohort into an empty database. Harmless once there are
      # families: it never touches a database that already has one.
      - key: SAATHI_SEED_DEMO
        value: "true"
      # The phone number the first seeded family answers to, so you can sign in
      # as a caregiver. Without an SMS provider the one-time code is written to
      # the service log, not sent.
      - key: SAATHI_SEED_DEMO_PHONE
        sync: false
      # Six digits. With no SMS provider, this phone (and only this one) signs in
      # with this code instead of one that only reaches the log. Leave it empty
      # to get real random codes.
      - key: SAATHI_DEMO_OTP
        sync: false
      # The email the first seeded family answers to, so you can sign in with a
      # code sent to it. Your own Gmail address works.
      - key: SAATHI_SEED_DEMO_EMAIL
        sync: false
      # Email for one-time codes, through Brevo over HTTPS (Render's free tier
      # cannot use SMTP). The address must be a sender verified in Brevo.
      - key: SAATHI_BREVO_API_KEY
        sync: false
      - key: SAATHI_EMAIL_FROM
        sync: false
      # The addresses of the two static sites below, comma-separated. Only
      # browsers need this; the Android app is not bound by CORS.
      - key: SAATHI_CORS_ORIGINS
        sync: false
      # Not SAATHI_GROQ_API_KEY: the settings field carries an explicit alias.
      # Optional. Without it the planner, the guard and the ledger all still
      # run; only the wording falls back to templates.
      - key: GROQ_API_KEY
        sync: false
      # Which hospital systems to read, one entry per hospital:
      #   TMH-MUM=fhir|https://ekyatra-hapi-fhir.onrender.com/fhir
      #   TMH-MUM=openemr|<base>|<client id>|<key id>|<pem path>
      # Comma-separated for more than one. Left unset, the service runs with
      # no HMS connector at all — everything else works and nothing watches a
      # hospital, which is a quiet way to lose half the demo.
      #
      # Both hospital systems below can be read, and comma-separating two
      # entries reads both at once. HAPI is free; OpenEMR is the one with a
      # clinical UI a judge can click, and is paid, because its MariaDB has to
      # run as a private service with a disk.
      #
      # The OpenEMR entry carries three more fields than the FHIR one — the
      # signing key's path, then the database to read arrival times from:
      #   TMH-MUM=openemr|<base>|<client id>|<key id>|/etc/secrets/openemr.pem|\
      #           ekyatra-openemr-db:3306/openemr|saathi_ro|<password>
      # The key is a Render Secret File, never a variable. See docs/deploy.md
      # §2b for the three one-time steps this needs; none of them fit here.
      - key: SAATHI_HOSPITAL_SYSTEMS
        sync: false
      # Speech, in the languages this is for. Also not under the prefix: the
      # settings field is aliased to the name the key is issued under.
      # Without it a family can still type, but nothing can be read aloud —
      # and no browser has an Odia voice, so an Odia family gets no audio at
      # all rather than a worse voice.
      - key: SARVAM_KEY
        sync: false

  - type: web
    name: ekyatra-saathi-control-centre
    runtime: static
    buildCommand: >-
      cd frontend && npm ci && npm run build -w @saathi/control-centre &&
      printf '{"apiBase":"%s"}' "$SAATHI_API_BASE" > apps/control-centre/dist/config.json
    staticPublishPath: frontend/apps/control-centre/dist
    envVars:
      # https://<your API>.onrender.com/api — the API service's address plus /api.
      - key: SAATHI_API_BASE
        sync: false
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: ekyatra-saathi-family
    runtime: static
    buildCommand: >-
      cd frontend && npm ci && npm run build -w @saathi/family-web &&
      printf '{"apiBase":"%s"}' "$SAATHI_API_BASE" > apps/family-web/dist/config.json
    staticPublishPath: frontend/apps/family-web/dist
    envVars:
      - key: SAATHI_API_BASE
        sync: false
      - key: NODE_VERSION
        value: "22"

  # The vendors' own site: a cab firm, a hotel desk, a pharmacy or a scheme
  # desk signing in to answer the jobs its organisation was asked to do. It
  # shares the backend and nothing else — the role cannot read a family.
  - type: web
    name: ekyatra-saathi-partner
    runtime: static
    buildCommand: >-
      cd frontend && npm ci && npm run build -w @saathi/partner-web &&
      printf '{"apiBase":"%s"}' "$SAATHI_API_BASE" > apps/partner-web/dist/config.json
    staticPublishPath: frontend/apps/partner-web/dist
    envVars:
      - key: SAATHI_API_BASE
        sync: false
      - key: NODE_VERSION
        value: "22"

  # The district hospital's system — a second HMS, deliberately unlike the
  # first. Bahmni speaks its own REST API with no change feed; this speaks
  # plain FHIR R4 with `_lastUpdated` cursors. Saathi reads both through one
  # port, which is what "plugs into any HMS" has to mean to be worth saying.
  #
  # Bahmni itself cannot live here: Render offers managed Postgres and Key
  # Value only, and OpenMRS needs MariaDB. Bahmni runs on its own host.
  - type: web
    name: ekyatra-hapi-fhir
    runtime: image
    image:
      url: docker.io/hapiproject/hapi:latest
    # Free tier: 512 MB, and it sleeps after about 15 idle minutes, so the first
    # request after a quiet spell waits a minute or two. HAPI is a Spring Boot app
    # that is comfortable at about a gigabyte, so the heap is capped and the
    # optional indexing and the connection pool are trimmed to fit. If it restarts
    # under load, that is the memory limit: move `plan` to `starter` (paid).
    plan: free
    region: frankfurt
    healthCheckPath: /fhir/metadata
    envVars:
      # HAPI listens on 8080. Render otherwise looks on 10000 first, so say so.
      - key: PORT
        value: "8080"
      # Its database is the Supabase project the API already uses (Session pooler,
      # port 5432; never 6543, HAPI's driver uses prepared statements), in a schema
      # of its own so HAPI's tables never sit among Saathi's. The schema was created
      # once in the Supabase SQL editor:  create schema if not exists hapi;
      #
      # The address and username are not secret. Only the password is entered in
      # Render by hand, and it is the same database password the API's
      # SAATHI_RECORDS_URL already holds.
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?currentSchema=hapi
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.slxlamipowcmgayhyhua
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
        value: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      # Supabase's free tier allows few connections; the API uses some of them.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
        value: "4"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx320m -Xss512k -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC"
      # Full-text indexing is optional and costs a lot of memory.
      - key: HAPI_FHIR_ADVANCED_LUCENE_INDEXING
        value: "false"
      # Appointment is the resource the connector reads, and ServiceRequest +
      # Observation are the creatinine beat. All are on by default; named here
      # so a future narrowing of the server's scope is a visible change.
      - key: HAPI_FHIR_FHIR_VERSION
        value: R4
      # Writes come from the seeder and from the lab posting a result, so the
      # server must accept them.
      - key: HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES
        value: "true"

  # The city hospital's system: OpenEMR, with its own clinical UI. It is the
  # stock image with nothing of ours inside, same as demo/openemr. OpenEMR
  # needs MariaDB, which Render's managed databases do not offer, so MariaDB
  # runs as a private service (reachable only from other Render services in
  # this region) with its own disk. Both need paid instances and disks.
  #
  # No password is written here. Render generates each one; read the admin
  # password (OE_PASS) from the ekyatra-openemr service's Environment tab.
  - type: pserv
    name: ekyatra-openemr-db
    runtime: image
    image:
      url: docker.io/library/mariadb:11
    plan: starter
    region: frankfurt
    # A freshly formatted disk has a `lost+found` folder at its root, which
    # MariaDB refuses to initialise on top of. Keep its data one level down.
    dockerCommand: mariadbd --datadir=/var/lib/mysql/data
    disk:
      name: openemr-db
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: ekyatra-openemr
    runtime: image
    image:
      url: docker.io/openemr/openemr:flex
    # OpenEMR is PHP plus a lot of its own startup work; 512 MB does not hold it.
    plan: standard
    region: frankfurt
    # First boot builds the schema and takes several minutes. No health check
    # path on purpose: a path that is not ready yet would fail the first deploy.
    disk:
      name: openemr-sites
      mountPath: /var/www/localhost/htdocs/openemr/sites
      sizeGB: 1
    envVars:
      - key: PORT
        value: "80"
      - key: MYSQL_HOST
        fromService:
          type: pserv
          name: ekyatra-openemr-db
          property: host
      - key: MYSQL_ROOT_PASS
        fromService:
          type: pserv
          name: ekyatra-openemr-db
          envVarKey: MYSQL_ROOT_PASSWORD
      - key: MYSQL_USER
        value: openemr
      - key: MYSQL_PASS
        generateValue: true
      - key: OE_USER
        value: admin
      - key: OE_PASS
        generateValue: true
