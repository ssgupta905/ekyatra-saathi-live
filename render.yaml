# The API on Supabase Postgres, and the two web apps as static sites.
#
# Create it with Render's Blueprint flow (New > Blueprint, pick this repo and the
# branch to deploy). Render then asks for every variable marked `sync: false`
# below; those are secrets or addresses only you know. See docs/deploy.md for
# what to put in each, in order.
#
# This runs the *real* world: it starts empty, login is on, and records live in
# the database named by SAATHI_RECORDS_URL. SAATHI_SEED_DEMO loads a small
# synthetic cohort into an empty database so there is something to look at.

services:
  - type: web
    name: ekyatra-saathi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Keep this next to the database: the Supabase project is in eu-west-1
    # (Ireland), and Frankfurt is Render's nearest region. Change both together.
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SAATHI_ENVIRONMENT
        value: render
      - key: SAATHI_WORLD
        value: real
      # Signs sign-in tokens. Generated once by Render; changing it signs
      # everybody out.
      - key: SAATHI_AUTH_SECRET
        generateValue: true
      # Supabase > Connect > Session pooler. Render's free tier reaches IPv4
      # only and Supabase's direct host is IPv6, so the pooler is not optional.
      - key: SAATHI_RECORDS_URL
        sync: false
      # The first administrator, created once if no such account exists.
      - key: SAATHI_ADMIN_USERNAME
        sync: false
      - key: SAATHI_ADMIN_PASSWORD
        sync: false
      # Load a synthetic cohort into an empty database. Harmless once there are
      # families: it never touches a database that already has one.
      - key: SAATHI_SEED_DEMO
        value: "true"
      # The phone number the first seeded family answers to, so you can sign in
      # as a caregiver. Without an SMS provider the one-time code is written to
      # the service log, not sent.
      - key: SAATHI_SEED_DEMO_PHONE
        sync: false
      # Six digits. With no SMS provider, this phone (and only this one) signs in
      # with this code instead of one that only reaches the log. Leave it empty
      # to get real random codes.
      - key: SAATHI_DEMO_OTP
        sync: false
      # The email the first seeded family answers to, so you can sign in with a
      # code sent to it. Your own Gmail address works.
      - key: SAATHI_SEED_DEMO_EMAIL
        sync: false
      # Email for one-time codes, through Brevo over HTTPS (Render's free tier
      # cannot use SMTP). The address must be a sender verified in Brevo.
      - key: SAATHI_BREVO_API_KEY
        sync: false
      - key: SAATHI_EMAIL_FROM
        sync: false
      # The addresses of the two static sites below, comma-separated. Only
      # browsers need this; the Android app is not bound by CORS.
      - key: SAATHI_CORS_ORIGINS
        sync: false
      # Not SAATHI_GROQ_API_KEY: the settings field carries an explicit alias.
      # Optional. Without it the planner, the guard and the ledger all still
      # run; only the wording falls back to templates.
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: ekyatra-saathi-control-centre
    runtime: static
    buildCommand: >-
      cd frontend && npm ci && npm run build -w @saathi/control-centre &&
      printf '{"apiBase":"%s"}' "$SAATHI_API_BASE" > apps/control-centre/dist/config.json
    staticPublishPath: frontend/apps/control-centre/dist
    envVars:
      # https://<your API>.onrender.com/api — the API service's address plus /api.
      - key: SAATHI_API_BASE
        sync: false
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: ekyatra-saathi-family
    runtime: static
    buildCommand: >-
      cd frontend && npm ci && npm run build -w @saathi/family-web &&
      printf '{"apiBase":"%s"}' "$SAATHI_API_BASE" > apps/family-web/dist/config.json
    staticPublishPath: frontend/apps/family-web/dist
    envVars:
      - key: SAATHI_API_BASE
        sync: false
      - key: NODE_VERSION
        value: "22"
