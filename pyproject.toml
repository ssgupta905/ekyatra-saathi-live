[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekyatra-saathi"
version = "0.1.0"
description = "Readiness-driven visit planning that cuts wasted trips for families travelling for cancer care."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "langgraph>=0.2.50",
  "anthropic>=0.69",
  "groq>=0.11",
  # Multipart form parsing, for the family's spoken replies.
  "python-multipart>=0.0.9",
  # Local identity: signed sign-in tokens and hashed staff passwords.
  "PyJWT>=2.8",
  "argon2-cffi>=23.1",
  # RSA, for SMART Backend Services. An EHR like OpenEMR will not take a
  # password or a client secret for system access: the connector signs a JWT
  # assertion with a private key. PyJWT needs this to do RS384 at all.
  "cryptography>=43.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30", "psycopg[binary]>=3.2"]
# Reading OpenEMR's arrival timestamps. Optional on purpose: without it the
# Console reports that a family arrived and claims no delay, which is the
# honest degradation. See ports/clinic_flow.py.
openemr = ["PyMySQL>=1.1"]
neo4j = ["neo4j>=5.25"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[project.scripts]
saathi-demo = "saathi.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/saathi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# Generated by alembic; regenerating would only reformat it back.
extend-exclude = ["backend/saathi/db/migrations/versions"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
