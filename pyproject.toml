[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekyatra-saathi"
version = "0.1.0"
description = "Readiness-driven visit planning that cuts wasted trips for families travelling for cancer care."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "langgraph>=0.2.50",
  "anthropic>=0.69",
  "groq>=0.11",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
neo4j = ["neo4j>=5.25"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[project.scripts]
saathi-demo = "saathi.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/saathi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
